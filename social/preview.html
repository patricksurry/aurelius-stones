<!DOCTYPE html>
<!-- Source of preview.png, the image link previews show. Rebuild with: python3 social/render.py -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; }
    body {
      background: #f3f0e8;
      color: #1f1d1a;
      font-family: 'EB Garamond', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stone {
      width: 860px;
      padding: 64px 80px 56px;
      background: #fdfcf9;
      border: 2px solid #c9b6a7;
      border-radius: 52px 60px 48px 56px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.06);
      box-sizing: border-box;
    }
    .discipline { font-size: 26px; letter-spacing: 0.06em; color: #736c60; margin-bottom: 18px; }
    .maxim { font-size: 58px; line-height: 1.18; font-style: italic; margin-bottom: 40px; }
    .foot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #e4dfd3; padding-top: 22px; }
    .title { font-size: 30px; font-weight: 500; }
    .greek { font-size: 28px; color: #6f685c; }
  </style>
</head>
<body>
  <div class="stone">
    <div class="discipline">Judgment</div>
    <div class="maxim">Things stand outside the door; only your judgment lets them in.</div>
    <div class="foot">
      <span class="title">Marcus Aurelius · Meditations</span>
      <span class="greek">Τὰ εἰς ἑαυτόν</span>
    </div>
  </div>
</body>
</html>
